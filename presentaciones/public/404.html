<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A1628">
  <title>No encontrada | ByC Servicios Financieros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0A1628;
      --serif: 'Cormorant Garamond', Garamond, Georgia, serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--navy); color: #fff; font-family: var(--sans); text-align: center;
    }
    .logo { width: 120px; height: auto; display: block; margin: 0 auto 32px; }
    h1 { font-family: var(--serif); font-weight: 600; font-size: 2.2rem; line-height: 1.15; }
    p { margin-top: 12px; font-size: .95rem; color: rgba(255,255,255,.7); max-width: 360px; }
    a {
      display: inline-block; margin-top: 32px; padding: 12px 24px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.3); color: #fff; text-decoration: none; font-size: .9rem;
    }
    a:hover { background: rgba(255,255,255,.08); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/img/logo-byc-blanco-320.png" alt="ByC Servicios Financieros">
    <h1>Presentación no disponible</h1>
    <p>El enlace no existe o la presentación fue retirada. Si crees que es un error, contacta a tu ejecutivo de ByC.</p>
    <a href="https://byc.cl">Ir a byc.cl</a>
  </main>
</body>
</html>
