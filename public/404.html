<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página no encontrada | B&C Servicios Financieros</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0a1628;
            --navy-light: #132240;
            --gold: #c9a84c;
            --white: #ffffff;
            --font-serif: 'Fraunces', Georgia, serif;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            font-family: var(--font-sans);
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 50%, var(--navy) 100%);
            color: var(--white);
            text-align: center;
        }
        .logo { height: 64px; width: auto; margin-bottom: 48px; }
        .etiqueta {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 16px;
        }
        h1 {
            font-family: var(--font-serif);
            font-size: clamp(2rem, 6vw, 2.8rem);
            font-weight: 300;
            line-height: 1.2;
            margin-bottom: 20px;
        }
        .linea { width: 50px; height: 2px; background: var(--gold); margin: 0 auto 24px; }
        p {
            max-width: 420px;
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 40px;
        }
        .boton {
            display: inline-block;
            padding: 14px 32px;
            border: 1px solid var(--gold);
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gold);
            text-decoration: none;
            transition: background 0.3s, color 0.3s;
        }
        .boton:hover, .boton:focus-visible { background: var(--gold); color: var(--navy); }
    </style>
</head>
<body>
    <a href="/"><img class="logo" src="/img/logo-byc-blanco-320.webp" alt="B&C Servicios Financieros" width="320" height="228"></a>
    <div class="etiqueta">Error 404</div>
    <h1>Esta página no existe</h1>
    <div class="linea"></div>
    <p>Es posible que la dirección esté mal escrita o que la página haya cambiado de lugar.</p>
    <a class="boton" href="/">Volver al inicio</a>
</body>
</html>
